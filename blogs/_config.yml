title: DocumentDB Blog
description: Insights, updates, and deep dives into the world of document databases and open-source innovation.
# Shared external links. The Next.js app keeps the same values in
# app/services/externalLinks.ts; update both when one changes.
discord_url: https://discord.gg/vH7bYu524D
# Shared release announcement target. app/services/externalLinks.ts holds
# the same site-root path.
release_announcement_url: /blogs/posts/documentdb-1-0/
baseurl: ""
layouts_dir: blogs/_layouts
includes_dir: blogs/_includes
data_dir: blogs/_data
# Absolute host for og:url, og:image, and the Atom feed's permanent IDs.
url: "https://documentdb.io"
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
defaults:
  -
    scope:
      path: ""
    values:
      layout: default
  -
    scope:
      path: ""
      type: posts
    values:
      layout: post
      category: documentdb-blog
      section: blogs
      permalink: /blogs/posts/:title/
