# Automated dependency updates.
#
# Dependabot runs on GitHub's infrastructure, so lockfile updates always
# resolve against the public npm registry. This keeps `resolved` URLs in
# package-lock.json canonical regardless of any registry proxy a
# contributor may have configured locally.
version: 2
updates:
  # Next.js site dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Only touch package.json when a bump requires it; in-range updates
    # stay confined to package-lock.json.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: npm
      include: scope
    groups:
      # The ESLint packages are peer-locked to each other and must move
      # together. eslint-config-next@15 peer-requires
      # eslint@"^7.23.0 || ^8.0.0 || ^9.0.0", so a lone eslint 10 bump
      # fails to install with ERESOLVE; eslint-config-next@16 relaxes
      # that to eslint@">=9.0.0". Grouping all update types, majors
      # included, keeps them in a single installable PR. This group is
      # listed first so it claims these packages before the catch-all
      # group below.
      eslint:
        patterns:
          - eslint
          - eslint-config-next
          - "@next/eslint-plugin-next"
        update-types:
          - major
          - minor
          - patch
      # Batch routine minor/patch bumps into a single PR to keep the
      # review load low. Majors still arrive as individual PRs so each
      # one can be evaluated on its own.
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # Jekyll toolchain for the blogs section
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: bundler
      include: scope
    groups:
      bundler-minor-and-patch:
        update-types:
          - minor
          - patch

  # Workflow actions (actions/checkout, actions/setup-node, ...)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: actions
    groups:
      github-actions:
        update-types:
          - major
          - minor
          - patch
